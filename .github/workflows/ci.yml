name: Validate tutor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate.py
      - run: python scripts/sync_mcp_content.py --check
      - run: python -m unittest discover -s tests -v
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci
        working-directory: mcp-worker
      - run: npm run typecheck
        working-directory: mcp-worker
      - run: npm test
        working-directory: mcp-worker

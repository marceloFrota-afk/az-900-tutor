name: Monitor official sources
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-source-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect changes or collection failures without issue credentials
        run: python scripts/monitor.py
      - name: Preserve candidate and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-review
          path: work/monitor/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: collect
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: official-source-review
          path: work/monitor/
      - name: Publish changes or failures from the collection report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/monitor.py --publish-report
      - name: Preserve publication diagnostics even when issue access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-publication
          path: work/monitor/
          if-no-files-found: error
          retention-days: 14
